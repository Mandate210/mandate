[toolchain]
anchor_version = "0.32.1"
solana_version = "4.2.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
drain_cover = "DsRdHv4QRYQ7teVhwuLVttktF792gvDFQdiuraQ4eF4P"

[programs.localnet]
drain_cover = "DsRdHv4QRYQ7teVhwuLVttktF792gvDFQdiuraQ4eF4P"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` cannot run this suite. Anchor executes scripts inside WSL, where
# there is no node — pnpm and the TS tooling live on Windows by design (docs/PLAN.md
# → «Тулчейн: розподіл між WSL і Windows»). The flow is three steps instead:
#   WSL:      solana-test-validator
#   WSL:      anchor deploy
#   Windows:  pnpm --filter @drain-cover/tests test:integration
test = "echo 'Run the integration suite from Windows — see the comment in Anchor.toml' && exit 1"
