[package]
name = "drain-cover"
version = "0.1.0"
edition = "2021"
description = "Parametric cover against unauthorized use of a protocol's privileged admin access"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "drain_cover"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Emitted by Anchor's macros but never declared by them. Without these three the
# unexpected_cfgs lint fires, and CI runs clippy with -D warnings.
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
# `solana` is a cfg the platform-tools compiler sets for the SBF target; host
# builds do not know it. Not a feature, so it cannot be declared above.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
# `init-if-needed` is on for one account: the attestor set is an upsert, since a
# removed attestor keeps the account that records their agreements and can be
# admitted again (instructions/set_attestor.rs).
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
