[package]
name = "drain-cover"
version = "0.1.0"
edition = "2021"
description = "Parametric cover against unauthorized use of a protocol's privileged admin access"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "drain_cover"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
