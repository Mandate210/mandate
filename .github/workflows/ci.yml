name: ci

on: [push, pull_request]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — pnpm/action-setup@v4 refuses to start when
      # the version is given twice, and package.json's packageManager field is both
      # more precise (9.15.0) and the one corepack reads locally.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versions are pinned in rust-toolchain.toml and Anchor.toml; drift between
      # them and CI is risk R-8 in docs/PLAN.md.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
